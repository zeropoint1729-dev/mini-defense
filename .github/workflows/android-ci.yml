name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
          KS_ALIAS: ${{ secrets.KS_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.keystore
          else
            keytool -genkeypair -v -keystore release.keystore -alias mini \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass minipass -keypass minipass -dname "CN=MiniDefense"
          fi
          echo "KS_PASS=${KS_PASS:-minipass}" >> $GITHUB_ENV
          echo "KS_ALIAS=${KS_ALIAS:-mini}" >> $GITHUB_ENV

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Build release APK
        run: gradle assembleRelease --no-daemon

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: mini-defense-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
